spring:
  application:
    name: instahyre-service

server:
  port: 8083

logging:
  file:
    name: ./logs/instahyre-service.log

  level:
    root: INFO
    com.achhecode: INFO

  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: ./logs/instahyre-service.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: true


playwright:
  browser:
    mode: ATTACH
    headless: false
    executable-path: ""
    attach:
      host: 127.0.0.1
      port: 9222
  capture:
    dir: ./captures
    

instahyre:
  username: ${INSTAHYRE_USERNAME}
  password: ${INSTAHYRE_PASSWORD}
  
  resume-path: ${INSTAHYRE_RESUME_PATH}
  
  questionnaire:
    answers-file: ${QUESTIONNAIRE_ANSWERS_FILE}