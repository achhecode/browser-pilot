spring:
  application:
    name: browser-pilot


  datasource:
    url: jdbc:h2:mem:browserpilotdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console


springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

browserpilot:

  browser:
    mode: attach
    headless: false
    executable-path: 

    attach:
      host: 127.0.0.1
      port: 9222

  capture:
    dir: ./captures

management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  file:
    name: ./logs/browser-pilot.log

  level:
    root: INFO
    com.achhecode.browser_pilot: INFO

  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: ./logs/browser-pilot.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: true


website:
  instahyre:
    username: ${INSTAHYRE_USERNAME}
    password: ${INSTAHYRE_PASSWORD}