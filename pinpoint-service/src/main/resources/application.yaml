spring:
  application:
    name: pinpoint-service

logging:
  file:
    name: ./logs/pinpoint-service.log

  level:
    root: INFO
    com.achhecode: INFO

  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"

  logback:
    rollingpolicy:
      file-name-pattern: ./logs/pinpoint-service.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      total-size-cap: 1GB
      max-history: 30
      clean-history-on-start: true


playwright:
  browser:
    mode: ATTACH
    headless: false
    executable-path: ""
    attach:
      host: 127.0.0.1
      port: 9222
  capture:
    dir: ./captures